name: 'SegInfo Secure Scan'
description: 'Run SegInfo secure-scan (secrets + SCA + IaC), upload the SARIF report to the Security tab and comment on the PR'
author: 'SegInfo'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  token:
    description: 'Token with security-events:write (SARIF upload) and pull-requests:write (PR comment)'
    required: false
    default: ${{ github.token }}
  files:
    description: 'Directory to scan'
    required: false
    default: '.'
  config:
    description: 'Optional path to a secure-scan config file (secure-scan.config.json is discovered in the scanned directory otherwise)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install dependencies and build
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --no-fund --no-audit
        npm run build
    - name: Run secure-scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        SECURE_SCAN_FILES: ${{ inputs.files }}
        SECURE_SCAN_CONFIG: ${{ inputs.config }}
      run: node "$GITHUB_ACTION_PATH/dist/action/main.js"
